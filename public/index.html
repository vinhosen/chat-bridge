<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Bridge — Dual-Mode AI &amp; Human Console</title>
  <meta name="description" content="Live WebSocket console for the Dual-Mode Chat Bridge (MCP SSE, REST API, SQLite, Loop Guard)." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Primitive Tokens */
      --stone-50: #f6f6f4;
      --stone-100: #ecece8;
      --stone-200: #e0e0da;
      --stone-300: #c8c8c0;
      --stone-500: #6b6e73;
      --stone-700: #373a40;
      --stone-900: #14171a;
      --white: #ffffff;

      --blue-50: #eff6ff;
      --blue-200: #bfdbfe;
      --blue-700: #1d4ed8;

      --emerald-50: #ecfdf5;
      --emerald-200: #a7f3d0;
      --emerald-600: #059669;
      --emerald-700: #047857;

      --amber-50: #fffbeb;
      --amber-200: #fde68a;
      --amber-600: #d97706;
      --amber-700: #b45309;

      --red-50: #fef2f2;
      --red-200: #fecaca;
      --red-600: #dc2626;
      --red-700: #b91c1c;

      /* Semantic Tokens */
      --bg-canvas: var(--stone-50);
      --bg-surface: var(--white);
      --bg-subtle: var(--stone-100);
      --border-subtle: var(--stone-200);
      --border-strong: var(--stone-300);
      --text-primary: var(--stone-900);
      --text-secondary: var(--stone-700);
      --text-muted: var(--stone-500);

      --font-sans: 'Inter', 'IBM Plex Sans Thai', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-card: 0 1px 2px rgba(20, 23, 26, 0.04);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 1040px;
      margin: 0 auto;
      background-color: var(--bg-surface);
      border-left: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
    }

    /* Header Bar */
    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px 16px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .ws-indicator {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      background-color: var(--bg-subtle);
      padding: 3px 9px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
    }

    .ws-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--amber-600);
      transition: background-color 0.2s ease;
    }

    .ws-dot.connected {
      background-color: var(--emerald-600);
    }

    .ws-dot.disconnected {
      background-color: var(--red-600);
    }

    .channel-form {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .channel-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .channel-input {
      width: 112px;
      padding: 4px 8px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-primary);
      background-color: var(--bg-surface);
    }

    .channel-input:focus {
      outline: 2px solid var(--blue-200);
      border-color: var(--blue-700);
    }

    /* Telemetry & Controls */
    .telemetry-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-subtle);
      color: var(--text-secondary);
    }

    .status-pill.state-ACTIVE,
    .status-pill.state-WORKING,
    .status-pill.state-DONE {
      background-color: var(--emerald-50);
      color: var(--emerald-700);
      border-color: var(--emerald-200);
    }

    .status-pill.state-PAUSED {
      background-color: var(--amber-50);
      color: var(--amber-700);
      border-color: var(--amber-200);
    }

    .status-pill.state-HALTED {
      background-color: var(--red-50);
      color: var(--red-700);
      border-color: var(--red-200);
    }

    .turn-meter {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      background-color: var(--bg-canvas);
    }

    .turn-text {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .turn-track {
      width: 56px;
      height: 6px;
      border-radius: 999px;
      background-color: var(--stone-200);
      overflow: hidden;
    }

    .turn-fill {
      height: 100%;
      width: 0%;
      background-color: var(--emerald-600);
      transition: width 0.2s ease, background-color 0.2s ease;
    }

    .turn-fill.warn {
      background-color: var(--amber-600);
    }

    .turn-fill.danger {
      background-color: var(--red-600);
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button {
      font-family: var(--font-sans);
      cursor: pointer;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      font-size: 0.76rem;
      font-weight: 600;
      padding: 6px 11px;
      background-color: var(--bg-surface);
      color: var(--text-primary);
      transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
    }

    button:hover:not(:disabled) {
      background-color: var(--bg-subtle);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-pause {
      color: var(--amber-700);
      border-color: var(--amber-200);
      background-color: var(--amber-50);
    }

    .btn-pause:hover:not(:disabled) {
      background-color: #fef3c7;
    }

    .btn-pause.is-paused {
      color: var(--emerald-700);
      border-color: var(--emerald-200);
      background-color: var(--emerald-50);
    }

    .btn-reset {
      color: var(--text-secondary);
    }

    .btn-switch {
      padding: 4px 8px;
      font-size: 0.74rem;
    }

    /* Alert Banner */
    .guard-banner {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 20px;
      font-size: 0.84rem;
      font-weight: 500;
      border-bottom: 1px solid var(--border-subtle);
    }

    .guard-banner.visible {
      display: flex;
    }

    .guard-banner.halted {
      background-color: var(--red-50);
      color: var(--red-700);
      border-bottom-color: var(--red-200);
    }

    .guard-banner.paused {
      background-color: var(--amber-50);
      color: var(--amber-700);
      border-bottom-color: var(--amber-200);
    }

    /* Chat Timeline */
    .chat-feed {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: var(--bg-canvas);
    }

    .empty-state {
      margin: auto;
      text-align: center;
      max-width: 380px;
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.55;
      padding: 28px 20px;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius-lg);
      background-color: var(--bg-surface);
    }

    .empty-state strong {
      display: block;
      color: var(--text-primary);
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .msg-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: fadeSlide 0.16s ease-out;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg-card.sender-human {
      border-left: 3px solid var(--amber-600);
    }

    .msg-card.sender-gemini {
      border-left: 3px solid var(--blue-700);
    }

    .msg-card.sender-antigravity {
      border-left: 3px solid var(--emerald-600);
    }

    .msg-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .msg-meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .sender-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-subtle);
      color: var(--text-secondary);
    }

    .sender-badge.badge-gemini {
      background-color: var(--blue-50);
      color: var(--blue-700);
      border-color: var(--blue-200);
    }

    .sender-badge.badge-antigravity {
      background-color: var(--emerald-50);
      color: var(--emerald-700);
      border-color: var(--emerald-200);
    }

    .sender-badge.badge-human {
      background-color: var(--amber-50);
      color: var(--amber-700);
      border-color: var(--amber-200);
    }

    .target-chip {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .status-chip {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      background-color: var(--bg-subtle);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
    }

    .msg-meta-right {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .msg-content {
      margin: 0;
      font-size: 0.92rem;
      line-height: 1.55;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Composer */
    .composer {
      border-top: 1px solid var(--border-subtle);
      background-color: var(--bg-surface);
      padding: 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .composer-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .field-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    select {
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-strong);
      background-color: var(--bg-surface);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 0.75rem;
    }

    .composer-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      padding: 10px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: 0.92rem;
      line-height: 1.45;
      color: var(--text-primary);
      background-color: var(--bg-canvas);
    }

    textarea:focus {
      outline: 2px solid var(--blue-200);
      border-color: var(--blue-700);
      background-color: var(--bg-surface);
    }

    .btn-send {
      padding: 10px 18px;
      height: 44px;
      background-color: var(--stone-900);
      color: var(--white);
      border-color: var(--stone-900);
      font-size: 0.84rem;
    }

    .btn-send:hover:not(:disabled) {
      background-color: #2b3036;
    }

    .error-note {
      display: none;
      font-size: 0.8rem;
      color: var(--red-700);
      font-weight: 500;
    }

    .error-note.visible {
      display: block;
    }

    @media (max-width: 680px) {
      .topbar {
        padding: 12px 14px;
      }
      .chat-feed {
        padding: 14px;
      }
      .composer {
        padding: 12px 14px;
      }
      .composer-row {
        flex-direction: column;
        align-items: stretch;
      }
      .btn-send {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-group">
        <h1>Chat Bridge</h1>
        <span class="ws-indicator" title="Live WebSocket Connection">
          <span id="ws-status-dot" class="ws-dot"></span>
          <span id="ws-status-text">Connecting...</span>
        </span>
        <form id="channel-form" class="channel-form">
          <label for="channel-input" class="channel-label">Channel</label>
          <input id="channel-input" class="channel-input" type="text" value="default" aria-label="Channel ID" />
          <button id="channel-switch-btn" type="submit" class="btn-switch">Switch</button>
        </form>
      </div>

      <div class="telemetry-group">
        <span id="task-state-pill" class="status-pill state-ACTIVE">ACTIVE</span>

        <div class="turn-meter" title="Consecutive AI turns before Loop Guard triggers">
          <span id="ai-turn-counter" class="turn-text">AI Turns: 0 / 10</span>
          <div class="turn-track">
            <div id="ai-turn-fill" class="turn-fill"></div>
          </div>
        </div>

        <div class="btn-group">
          <button id="pause-btn" type="button" class="btn-pause">[PAUSE]</button>
          <button id="reset-btn" type="button" class="btn-reset">[RESET]</button>
        </div>
      </div>
    </header>

    <div id="guard-banner" class="guard-banner" role="status" aria-live="polite">
      <span id="guard-banner-text"></span>
    </div>

    <main id="chat-feed" class="chat-feed" aria-live="polite">
      <div id="empty-state" class="empty-state">
        <strong>Channel Ready</strong>
        Waiting for messages from Gemini (MCP SSE), Antigravity (REST / CLI), or Human operator.
      </div>
    </main>

    <footer class="composer">
      <form id="composer-form">
        <div class="composer-controls">
          <span class="sender-badge badge-human">Human</span>
          <label class="field-inline">
            Target
            <select id="target-select" aria-label="Message target">
              <option value="all">all</option>
              <option value="gemini">gemini</option>
              <option value="antigravity">antigravity</option>
            </select>
          </label>
          <label class="field-inline">
            Status
            <select id="status-select" aria-label="Message status">
              <option value="INFO">INFO</option>
              <option value="INSTRUCTION">INSTRUCTION</option>
              <option value="APPROVE">APPROVE</option>
              <option value="QUESTION">QUESTION</option>
              <option value="STOP">STOP</option>
            </select>
          </label>
        </div>

        <div class="composer-row" style="margin-top: 8px;">
          <textarea
            id="human-input"
            rows="2"
            placeholder="Type a message as Human... (Enter to send, Shift+Enter for newline)"
            aria-label="Human message input"
          ></textarea>
          <button id="send-btn" type="submit" class="btn-send">Send</button>
        </div>
        <div id="error-note" class="error-note" role="alert"></div>
      </form>
    </footer>
  </div>

  <script>
    (function () {
      const wsStatusDot = document.getElementById('ws-status-dot');
      const wsStatusText = document.getElementById('ws-status-text');
      const channelForm = document.getElementById('channel-form');
      const channelInput = document.getElementById('channel-input');
      const taskStatePill = document.getElementById('task-state-pill');
      const aiTurnCounter = document.getElementById('ai-turn-counter');
      const aiTurnFill = document.getElementById('ai-turn-fill');
      const pauseBtn = document.getElementById('pause-btn');
      const resetBtn = document.getElementById('reset-btn');
      const guardBanner = document.getElementById('guard-banner');
      const guardBannerText = document.getElementById('guard-banner-text');
      const chatFeed = document.getElementById('chat-feed');
      const emptyState = document.getElementById('empty-state');
      const composerForm = document.getElementById('composer-form');
      const targetSelect = document.getElementById('target-select');
      const statusSelect = document.getElementById('status-select');
      const humanInput = document.getElementById('human-input');
      const sendBtn = document.getElementById('send-btn');
      const errorNote = document.getElementById('error-note');

      const params = new URLSearchParams(window.location.search);
      let currentChannel = (params.get('channel_id') || 'default').trim() || 'default';
      channelInput.value = currentChannel;

      let currentChannelState = {
        channel_id: currentChannel,
        state: 'ACTIVE',
        ai_turn_count: 0,
        max_ai_turns: 10
      };

      const renderedIds = new Set();
      let socket = null;
      let reconnectDelay = 1000;
      let reconnectTimer = null;

      function formatBadgeLabel(sender) {
        const clean = String(sender || 'unknown').trim();
        const lower = clean.toLowerCase();
        if (lower === 'gemini') return 'Gemini';
        if (lower === 'antigravity') return 'Antigravity';
        if (lower === 'human') return 'Human';
        return clean;
      }

      function badgeClass(sender) {
        const lower = String(sender || '').trim().toLowerCase();
        if (lower === 'gemini') return 'badge-gemini';
        if (lower === 'antigravity') return 'badge-antigravity';
        if (lower === 'human') return 'badge-human';
        return '';
      }

      function cardClass(sender) {
        const lower = String(sender || '').trim().toLowerCase();
        if (lower === 'gemini') return 'sender-gemini';
        if (lower === 'antigravity') return 'sender-antigravity';
        if (lower === 'human') return 'sender-human';
        return '';
      }

      function formatTime(iso) {
        if (!iso) return '';
        const date = new Date(iso);
        if (Number.isNaN(date.getTime())) return iso;
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      }

      function showError(msg) {
        if (!msg) {
          errorNote.textContent = '';
          errorNote.classList.remove('visible');
          return;
        }
        errorNote.textContent = msg;
        errorNote.classList.add('visible');
      }

      function updateChannelTelemetry(channel) {
        if (!channel) return;
        currentChannelState = channel;
        const state = String(channel.state || 'ACTIVE').toUpperCase();
        const turns = Number(channel.ai_turn_count || 0);
        const maxTurns = Number(channel.max_ai_turns || 10);

        taskStatePill.textContent = state;
        taskStatePill.className = `status-pill state-${state}`;

        aiTurnCounter.textContent = `AI Turns: ${turns} / ${maxTurns}`;
        const pct = Math.min(100, Math.round((turns / Math.max(1, maxTurns)) * 100));
        aiTurnFill.style.width = `${pct}%`;
        aiTurnFill.className = 'turn-fill';
        if (turns >= maxTurns || state === 'HALTED') {
          aiTurnFill.classList.add('danger');
        } else if (turns >= Math.ceil(maxTurns * 0.7)) {
          aiTurnFill.classList.add('warn');
        }

        if (state === 'PAUSED') {
          pauseBtn.textContent = '[RESUME]';
          pauseBtn.classList.add('is-paused');
        } else {
          pauseBtn.textContent = '[PAUSE]';
          pauseBtn.classList.remove('is-paused');
        }

        if (state === 'HALTED') {
          guardBanner.className = 'guard-banner visible halted';
          guardBannerText.textContent =
            'Loop Guard HALTED: Consecutive AI turns exceeded 10. Reply as Human or press [RESET] to resume.';
        } else if (state === 'PAUSED') {
          guardBanner.className = 'guard-banner visible paused';
          guardBannerText.textContent =
            'Channel PAUSED: AI agents are blocked until you press [RESUME] or [RESET].';
        } else {
          guardBanner.className = 'guard-banner';
          guardBannerText.textContent = '';
        }
      }

      function clearFeed() {
        renderedIds.clear();
        const cards = chatFeed.querySelectorAll('.msg-card');
        cards.forEach((c) => c.remove());
        emptyState.style.display = 'block';
      }

      function isNearBottom() {
        const threshold = 90;
        return chatFeed.scrollHeight - chatFeed.scrollTop - chatFeed.clientHeight < threshold;
      }

      function appendMessage(msg) {
        if (!msg || renderedIds.has(msg.id)) return;
        renderedIds.add(msg.id);
        emptyState.style.display = 'none';

        const shouldScroll = isNearBottom();

        const card = document.createElement('article');
        card.className = `msg-card ${cardClass(msg.sender)}`.trim();
        card.dataset.messageId = String(msg.id);

        const meta = document.createElement('div');
        meta.className = 'msg-meta';

        const metaLeft = document.createElement('div');
        metaLeft.className = 'msg-meta-left';

        const badge = document.createElement('span');
        badge.className = `sender-badge ${badgeClass(msg.sender)}`.trim();
        badge.textContent = formatBadgeLabel(msg.sender);

        const targetChip = document.createElement('span');
        targetChip.className = 'target-chip';
        targetChip.textContent = `→ ${msg.target || 'all'}`;

        const statusChip = document.createElement('span');
        statusChip.className = 'status-chip';
        statusChip.textContent = msg.status || 'INFO';

        metaLeft.appendChild(badge);
        metaLeft.appendChild(targetChip);
        metaLeft.appendChild(statusChip);

        const metaRight = document.createElement('span');
        metaRight.className = 'msg-meta-right';
        metaRight.textContent = `#${msg.id} · ${formatTime(msg.created_at)}`;

        meta.appendChild(metaLeft);
        meta.appendChild(metaRight);

        const body = document.createElement('p');
        body.className = 'msg-content';
        body.textContent = msg.content;

        card.appendChild(meta);
        card.appendChild(body);
        chatFeed.appendChild(card);

        if (shouldScroll || renderedIds.size <= 3) {
          chatFeed.scrollTop = chatFeed.scrollHeight;
        }
      }

      function setWsIndicator(status, label) {
        wsStatusDot.className = `ws-dot ${status}`.trim();
        wsStatusText.textContent = label;
      }

      function connectWebSocket() {
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
        if (socket) {
          try {
            socket.onclose = null;
            socket.close();
          } catch {
            // ignore
          }
        }

        const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${proto}//${window.location.host}/?channel_id=${encodeURIComponent(currentChannel)}`;
        setWsIndicator('', 'Connecting...');

        socket = new WebSocket(wsUrl);

        socket.addEventListener('open', () => {
          reconnectDelay = 1000;
          setWsIndicator('connected', 'Live');
          showError('');
        });

        socket.addEventListener('message', (event) => {
          let data;
          try {
            data = JSON.parse(event.data);
          } catch {
            return;
          }

          if (data.type === 'init') {
            clearFeed();
            updateChannelTelemetry(data.channel);
            if (Array.isArray(data.messages)) {
              for (const msg of data.messages) {
                appendMessage(msg);
              }
              chatFeed.scrollTop = chatFeed.scrollHeight;
            }
          } else if (data.type === 'message') {
            if (data.channel) updateChannelTelemetry(data.channel);
            if (data.message) appendMessage(data.message);
          } else if (data.type === 'state') {
            if (data.channel) updateChannelTelemetry(data.channel);
          } else if (data.type === 'error') {
            showError(data.error || 'Bridge error');
          }
        });

        socket.addEventListener('close', () => {
          setWsIndicator('disconnected', 'Reconnecting...');
          reconnectTimer = setTimeout(connectWebSocket, reconnectDelay);
          reconnectDelay = Math.min(8000, reconnectDelay * 2);
        });

        socket.addEventListener('error', () => {
          setWsIndicator('disconnected', 'Disconnected');
        });
      }

      async function postJson(endpoint, payload) {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error(data.error || `Request failed (${res.status})`);
        }
        return data;
      }

      channelForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const nextChannel = channelInput.value.trim() || 'default';
        currentChannel = nextChannel;
        channelInput.value = nextChannel;
        const url = new URL(window.location.href);
        url.searchParams.set('channel_id', nextChannel);
        window.history.replaceState({}, '', url.toString());

        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'subscribe', channel_id: nextChannel }));
        } else {
          connectWebSocket();
        }
      });

      pauseBtn.addEventListener('click', async () => {
        showError('');
        pauseBtn.disabled = true;
        try {
          const isPaused = String(currentChannelState.state).toUpperCase() === 'PAUSED';
          const data = isPaused
            ? await postJson('/api/state', { channel_id: currentChannel, state: 'ACTIVE' })
            : await postJson('/api/pause', { channel_id: currentChannel });
          if (data.channel) updateChannelTelemetry(data.channel);
        } catch (err) {
          showError(err.message);
        } finally {
          pauseBtn.disabled = false;
        }
      });

      resetBtn.addEventListener('click', async () => {
        showError('');
        resetBtn.disabled = true;
        try {
          const data = await postJson('/api/reset', { channel_id: currentChannel });
          if (data.channel) updateChannelTelemetry(data.channel);
        } catch (err) {
          showError(err.message);
        } finally {
          resetBtn.disabled = false;
        }
      });

      async function sendHumanMessage() {
        const content = humanInput.value.trim();
        if (!content) return;
        showError('');
        sendBtn.disabled = true;
        try {
          const data = await postJson('/api/send', {
            channel_id: currentChannel,
            sender: 'human',
            target: targetSelect.value,
            content,
            status: statusSelect.value
          });
          humanInput.value = '';
          if (data.channel) updateChannelTelemetry(data.channel);
          if (data.message) appendMessage(data.message);
        } catch (err) {
          showError(err.message);
        } finally {
          sendBtn.disabled = false;
          humanInput.focus();
        }
      }

      composerForm.addEventListener('submit', (e) => {
        e.preventDefault();
        sendHumanMessage();
      });

      humanInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendHumanMessage();
        }
      });

      connectWebSocket();
    })();
  </script>
</body>
</html>
